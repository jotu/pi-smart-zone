name: CI

on:
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # Weekly: catch breakage from new Pi releases.
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false

      - name: Install locked npm dependencies
        run: mise run install

      - name: Run checks
        run: mise run check

      - name: Test on the minimum supported Node.js version
        run: mise run test:min-node

  latest-pi:
    name: Latest Pi 1.x
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false

      - name: Install locked npm dependencies
        run: mise run install

      - name: Test against the latest compatible Pi
        run: mise run test:latest-pi
