name: Bug report
description: The widget is missing, wrong, or stale.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `pi --version`, this package's version, and your OS.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include how you installed the package (`pi list`).
