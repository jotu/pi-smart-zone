name: Feature request
description: Suggest a change to the widget.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the widget does not support? Check the ADRs in docs/adr first.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
