[tools]
node = "24.22.2"
actionlint = "1.7.12"
zizmor = "1.31.1"
"npm:renovate" = "44.206.0"

[tasks.install]
description = "Install locked development dependencies without lifecycle scripts"
shell = "bash -euo pipefail -c"
run = "npm ci --ignore-scripts"

[tasks.typecheck]
description = "Type-check the extension without emitting files"
shell = "bash -euo pipefail -c"
run = "./node_modules/.bin/tsc --project tsconfig.json"

[tasks.lint]
description = "Check code linting and formatting"
shell = "bash -euo pipefail -c"
run = "./node_modules/.bin/biome check ."

[tasks.format]
description = "Format code and JSON files"
shell = "bash -euo pipefail -c"
run = "./node_modules/.bin/biome format --write ."

[tasks.test]
description = "Run the Node.js test suite"
shell = "bash -euo pipefail -c"
run = "node --test 'test/**/*.test.ts'"

[tasks."commits:lint"]
description = "Check that commit subjects since origin/main are Conventional Commits"
shell = "bash -euo pipefail -c"
run = "bash scripts/commit-lint.sh --range origin/main..HEAD"

[tasks."pack:check"]
description = "Verify the exact npm package file list"
shell = "bash -euo pipefail -c"
run = "bash scripts/pack-check.sh"

[tasks."workflow:lint"]
description = "Lint GitHub Actions workflows with actionlint and zizmor"
shell = "bash -euo pipefail -c"
run = "actionlint && zizmor .github/workflows"

[tasks."renovate:validate"]
description = "Validate the Renovate configuration"
shell = "bash -euo pipefail -c"
run = "renovate-config-validator --strict"

[tasks.check]
description = "Run typecheck, lint, workflow lint, Renovate validation, tests, and package contents check"
shell = "bash -euo pipefail -c"
run = "mise run typecheck && mise run lint && mise run workflow:lint && mise run renovate:validate && mise run test && mise run pack:check"

[tasks."test:latest-pi"]
description = "Type-check and test against the latest Pi 1.x release without changing the lockfile"
shell = "bash -euo pipefail -c"
run = "npm install --no-save --ignore-scripts '@earendil-works/pi-coding-agent@>=1.5.0 <2' && mise run typecheck && mise run test"

[tasks."test:min-node"]
description = "Run the tests on the minimum supported Node.js version from package.json engines"
shell = "bash -euo pipefail -c"
run = "mise exec node@22.19.0 -- node --test 'test/**/*.test.ts'"
